<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【菜名】｜宿舍小廚房</title>
  <link rel="stylesheet" href="../css/kitchen.css">
</head>
<body>
  <main class="container">
    <a class="back-btn" href="../index.html">← 回食譜清單</a>

    <!-- 1. 菜名卡 -->
    <section class="dish-card">
      <div class="emoji">【emoji】</div>
      <h1>【菜名】</h1>
      <p>【一句介紹，20 字內】</p>
      <div class="badges">
        <span class="badge">💰 約 【總花費】 元</span>
        <span class="badge">🔌 【器材】</span>
        <span class="badge">⏱ 【分鐘】 分鐘</span>
      </div>
    </section>

    <!-- 2. 食材清單：食材＋份量＋價格，最後一行總花費 -->
    <section class="section">
      <h2>🛒 食材（1 人份）</h2>
      <ul class="ingredients">
        <li><span>【食材 份量】</span><span>約 【價格】 元</span></li>
        <li class="total"><span>總花費</span><span>約 【加總】 元</span></li>
      </ul>
    </section>

    <!-- 3. 步驟：動詞開頭，最多 8 步 -->
    <section class="section">
      <h2>👩‍🍳 步驟</h2>
      <ol class="steps">
        <li>【步驟】</li>
      </ol>
    </section>

    <!-- 4. 宿舍小提醒 -->
    <aside class="tip">
      <strong>🏠 宿舍小提醒</strong>
      【和宿舍限制有關的注意事項】
    </aside>

    <!-- 5. 變化版 -->
    <section class="section">
      <h2>✨ 變化版</h2>
      <ul>
        <li>【加料或替換做法】</li>
      </ul>
    </section>

    <!-- 6. 回首頁 -->
    <a class="back-btn" href="../index.html">← 回食譜清單</a>
  </main>
  <footer class="footer">宿舍小廚房</footer>
</body>
</html>
